          }
        },
        "required": [
          "status",
          "receipt"
        ],
        "type": "object"
      },
      "ConfigCategory": {
        "enum": [
          "default_profile",
          "profiles",
          "providers",
          "tools",
          "mcp",
          "environment",
          "sandbox",
          "runtime"

        "type": "string"
      },
      "ConfigChangedNotificationParams": {
        "additionalProperties": false,
        "properties": {
          "status": {
            "$ref": "#/components/schemas/ConfigStatus"
          }
        },
        "required": [
          "status"
        ],
        "type": "object"
      },
      "ConfigDiscardParams": {
        "additionalProperties": false,
        "properties": {
          "authorization": {
            "maxLength": 2048,
            "minLength": 1,
            "type": "string"
          },
          "desiredEtag": {
            "$ref": "#/components/schemas/ConfigEtag"
          },
          "idempotencyKey": {
            "$ref": "#/components/schemas/IdempotencyKey"
          }

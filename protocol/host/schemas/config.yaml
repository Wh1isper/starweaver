        "additionalProperties": false,
        "properties": {
          "config": {
            "$ref": "#/components/schemas/ConfigDocument"
          },
          "status": {
            "$ref": "#/components/schemas/ConfigStatus"
          }
        },
        "required": [
          "config",
          "status"
        ],
        "type": "object"
      },
      "ConfigIssue": {
        "additionalProperties": false,
        "properties": {

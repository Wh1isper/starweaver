          },
          "status": {
            "$ref": "#/components/schemas/ConfigStatus"
          },
          "validation": {
            "$ref": "#/components/schemas/ConfigValidation"
          }
        },
        "required": [
          "candidateEtag",
          "status",
          "validation"

          "expectedActiveEtag": {
            "$ref": "#/components/schemas/ConfigEtag"
          },
          "idempotencyKey": {
            "$ref": "#/components/schemas/IdempotencyKey"
          }
        },
        "required": [
          "expectedActiveEtag",
          "candidate",
          "candidateFingerprint",
          "authorization",
          "idempotencyKey"

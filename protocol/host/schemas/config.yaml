          },
          "candidateEtag": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ConfigEtag"
              },
              {
                "type": "null"
              }
            ],
            "x-starweaver-nullable": true
          },
          "expectedActiveEtag": {
            "$ref": "#/components/schemas/ConfigEtag"
          },
          "idempotencyKey": {
            "$ref": "#/components/schemas/IdempotencyKey"
          },
          "mode": {
            "$ref": "#/components/schemas/ConfigReloadMode"
          }

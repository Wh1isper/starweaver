            "maxItems": 64,
            "minItems": 1,
            "type": "array",
            "uniqueItems": true
          },
          "providers": {
            "items": {
              "$ref": "#/components/schemas/ConfigProvider"
            },
            "maxItems": 32,
            "minItems": 0,
            "type": "array",
            "uniqueItems": true
          }
        },
        "required": [
          "defaultProfile",
          "profiles",
          "providers"
        ],
        "type": "object"
      },
      "ConfigGetParams": {
        "additionalProperties": false,
        "properties": {},
        "required": [],
        "type": "object"

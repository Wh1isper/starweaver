name: Recover Rust SDK Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing full or SDK release tag, for example v0.14.0 or sdk-v0.14.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.event.inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Recover crates.io publication
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Parse and prepare release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          parsed="$(cargo run --quiet --locked -p xtask -- release-tag "$RELEASE_TAG")"
          scope="$(jq -r .scope <<<"$parsed")"
          version="$(jq -r .version <<<"$parsed")"
          if [[ "$scope" != "full" && "$scope" != "sdk" ]]; then
            echo "tag $RELEASE_TAG does not publish Rust SDK crates" >&2
            exit 1
          fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          source_revision="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$source_revision" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_revision" origin/main
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          mkdir release-metadata
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern starweaver-release.json --dir release-metadata
          cargo run --quiet --locked -p xtask -- release-manifest-verify \
            release-metadata/starweaver-release.json
          test "$(jq -r .release.scope release-metadata/starweaver-release.json)" = "$scope"
          test "$(jq -r .release.version release-metadata/starweaver-release.json)" = "$version"
          test "$(jq -r .release.tag release-metadata/starweaver-release.json)" = "$RELEASE_TAG"
          test "$(jq -r .release.source_revision release-metadata/starweaver-release.json)" = "$source_revision"
          rm -rf release-metadata
          cargo run --locked -p xtask -- release-prepare sdk "$version"
          test "$(cargo run --quiet --locked -p xtask -- workspace-version)" = "$version"

      - name: Publish missing crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish

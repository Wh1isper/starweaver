name: Release Rust SDK Component

on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source_revision:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish Rust SDK crates
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_revision }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-sdk

      - name: Prepare ephemeral SDK release metadata
        run: cargo run --locked -p xtask -- release-prepare sdk "${{ inputs.version }}"

      - name: Verify prepared workspace version
        run: test "$(cargo run --locked -p xtask -- workspace-version)" = "${{ inputs.version }}"

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish

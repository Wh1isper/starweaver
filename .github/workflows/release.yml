name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build ${{ matrix.name }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: cli-x86_64-unknown-linux-gnu
            package: starweaver-cli
            target: x86_64-unknown-linux-gnu
            archive: starweaver-cli-${{ github.event.release.tag_name }}-x86_64-unknown-linux-gnu.tar.gz
            bins: "starweaver starweaver-cli sw starweaver-rpc"
          - os: macos-latest
            name: cli-x86_64-apple-darwin
            package: starweaver-cli
            target: x86_64-apple-darwin
            archive: starweaver-cli-${{ github.event.release.tag_name }}-x86_64-apple-darwin.tar.gz
            bins: "starweaver starweaver-cli sw starweaver-rpc"
          - os: macos-latest
            name: cli-aarch64-apple-darwin
            package: starweaver-cli
            target: aarch64-apple-darwin
            archive: starweaver-cli-${{ github.event.release.tag_name }}-aarch64-apple-darwin.tar.gz
            bins: "starweaver starweaver-cli sw starweaver-rpc"
          - os: windows-latest
            name: cli-x86_64-pc-windows-msvc
            package: starweaver-cli
            target: x86_64-pc-windows-msvc
            archive: starweaver-cli-${{ github.event.release.tag_name }}-x86_64-pc-windows-msvc.zip
            bins: "starweaver.exe starweaver-cli.exe sw.exe starweaver-rpc.exe"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: |
          cargo build --release --locked -p "${{ matrix.package }}" --bins --target "${{ matrix.target }}"
          cargo build --release --locked -p starweaver-rpc --bins --target "${{ matrix.target }}"
          out_dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          for bin in ${{ matrix.bins }}; do
            cp "$out_dir/$bin" dist/
          done

      - name: Archive Unix binaries
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C dist .

      - name: Archive Windows binaries
        if: runner.os == 'Windows'
        run: powershell -NoProfile -Command "Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  build-computer-use-mcp:
    name: Build Computer Use MCP (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: computer-use-mcp-${{ matrix.target }}

      - name: Build Computer Use MCP binary
        run: |
          set -euo pipefail
          cargo build --release --locked \
            -p starweaver-computer-use \
            --features mcp-server \
            --bin starweaver-computer-use-mcp \
            --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/starweaver-computer-use-mcp"
          archive="starweaver-computer-use-mcp-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "$binary" dist/starweaver-computer-use-mcp
          tar -czf "$archive" -C dist starweaver-computer-use-mcp

      - name: Upload Computer Use MCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: starweaver-computer-use-mcp-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz
          path: starweaver-computer-use-mcp-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Desktop-managed runtime updates are paused while Desktop remains WIP.
  build-runtime-update-artifacts:
    name: Build independent RPC runtime update artifacts
    if: ${{ false }}
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: runtime-update-release

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install signing dependencies
        run: pnpm install --frozen-lockfile

      - name: Download raw RPC workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpc-binary-*
          path: runtime-input

      - name: Package, sign, and verify runtime update artifacts
        env:
          STARWEAVER_UPDATE_PUBLIC_KEY: ${{ vars.STARWEAVER_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          mkdir -p dist/runtime
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            binary="runtime-input/rpc-binary-${target}/starweaver-rpc"
            if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then binary="${binary}.exe"; fi
            node apps/starweaver-desktop/scripts/package-runtime-update.mjs \
              --version "$version" \
              --target "$target" \
              --revision "${{ github.sha }}" \
              --binary "$binary" \
              --output dist/runtime
            manifest="$GITHUB_WORKSPACE/dist/runtime/starweaver-runtime-${target}.manifest.json"
            pnpm --filter @starweaver/desktop tauri signer sign "$manifest"
            cargo run --locked -p xtask -- verify-update-signature "$manifest" "$manifest.sig"
          done

      - name: Attest runtime update assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/runtime/*

      - name: Upload runtime update workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-update-artifacts
          path: dist/runtime/*
          if-no-files-found: error

  # Desktop packaging and publication are paused while Desktop remains WIP.
  build-desktop-artifacts:
    name: Build Desktop ${{ matrix.target }} packages
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-tauri-linux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release-${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build updater-ready Desktop packages
        env:
          NO_STRIP: "1"
          STARWEAVER_BUILD_REVISION: ${{ github.sha }}
          STARWEAVER_DESKTOP_TARGET: ${{ matrix.target }}
          STARWEAVER_UPDATE_PUBLIC_KEY: ${{ vars.STARWEAVER_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updater_config="$(node apps/starweaver-desktop/scripts/tauri-updater-config.mjs)"
          pnpm --filter @starweaver/desktop tauri build --ci \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --config src-tauri/tauri.updater.conf.json \
            --config "$updater_config"
          node apps/starweaver-desktop/scripts/finalize-linux-appimage.mjs \
            --target "${{ matrix.target }}" \
            --bundle-root "target/${{ matrix.target }}/release/bundle" \
            --binary "target/${{ matrix.target }}/release/starweaver-rpc"

      - name: Collect and verify canonical Desktop update assets
        env:
          STARWEAVER_UPDATE_PUBLIC_KEY: ${{ vars.STARWEAVER_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          mkdir -p dist/desktop
          node apps/starweaver-desktop/scripts/collect-desktop-artifacts.mjs \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --bundle-root "target/${{ matrix.target }}/release/bundle" \
            --output dist/desktop
          expected_signature_count=1
          if [[ "${{ runner.os }}" == "Linux" ]]; then expected_signature_count=2; fi
          actual_signature_count=$(find dist/desktop -maxdepth 1 -type f \
            -name 'starweaver-desktop-*.sig' -print | wc -l | tr -d ' ')
          test "$actual_signature_count" -eq "$expected_signature_count"
          while IFS= read -r desktop_signature; do
            cargo run --locked -p xtask -- verify-update-signature \
              "${desktop_signature%.sig}" "$desktop_signature"
          done < <(find dist/desktop -maxdepth 1 -type f \
            -name 'starweaver-desktop-*.sig' -print)

      - name: Attest Desktop assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/desktop/*

      - name: Upload Desktop workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error

  build-protocol-artifacts:
    name: Package public host protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package protocol bundle and source schemas
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          mkdir -p dist/protocol
          cp protocol/host/generated/starweaver-host.openrpc.json \
            "dist/protocol/starweaver-host-${version}.openrpc.json"
          cp protocol/host/generated/manifest.json \
            "dist/protocol/starweaver-host-${version}.manifest.json"
          tar -czf "dist/protocol/starweaver-host-${version}-schemas.tar.gz" \
            protocol/host/openrpc.yaml protocol/host/schemas protocol/tooling \
            spec/ops/09-rpc-idl-and-client-generation.md

      - name: Upload protocol artifacts
        uses: actions/upload-artifact@v4
        with:
          name: host-protocol
          path: dist/protocol/*
          if-no-files-found: error

  build-python-sdist:
    name: Build Python source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Check Python lock file
        run: uv lock --locked

      - name: Verify Python package version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          python - <<'PY' "$version"
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          pyproject = tomllib.loads(Path("packages/starweaver-py/pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(f"Python package version mismatch: expected {expected}, got {actual}")
          PY

      - name: Build Python source distribution
        run: uv build --package starweaver --sdist -o dist/python

      - name: Upload Python sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/python/*
          if-no-files-found: error

  build-python-wheels:
    name: Build Python wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            args: --manifest-path packages/starweaver-py/Cargo.toml --release --locked --out dist/python --interpreter python3.11 python3.12 python3.13 --compatibility pypi
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            manylinux: auto
            args: --manifest-path packages/starweaver-py/Cargo.toml --release --locked --out dist/python --find-interpreter --compatibility pypi
          - os: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
            manylinux: auto
            args: --manifest-path packages/starweaver-py/Cargo.toml --release --locked --out dist/python --find-interpreter --compatibility pypi
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            manylinux: auto
            args: --manifest-path packages/starweaver-py/Cargo.toml --release --locked --out dist/python --find-interpreter --compatibility pypi
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Build Python wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: ${{ matrix.args }}
          sccache: "true"

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.name }}
          path: dist/python/*
          if-no-files-found: error

  upload-core-assets:
    name: Upload core release assets
    needs: [build-binaries, build-computer-use-mcp, build-protocol-artifacts, build-python-sdist, build-python-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: starweaver-cli-*
          path: dist
          merge-multiple: true

      - name: Download Computer Use MCP archives
        uses: actions/download-artifact@v4
        with:
          pattern: starweaver-computer-use-mcp-*
          path: dist
          merge-multiple: true

      - name: Download protocol artifacts
        uses: actions/download-artifact@v4
        with:
          name: host-protocol
          path: dist

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Generate core checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload immutable core assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          repo="${{ github.repository }}"
          existing_assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          for asset in dist/*; do
            name="${asset##*/}"
            if printf '%s\n' "$existing_assets" | grep -Fqx "$name"; then
              echo "release asset already exists and will not be replaced: $name" >&2
              exit 1
            fi
          done
          payloads=()
          for asset in dist/*; do
            if [[ "$asset" != "dist/checksums.txt" ]]; then payloads+=("$asset"); fi
          done
          test "${#payloads[@]}" -gt 0
          gh release upload "$tag" "${payloads[@]}" --repo "$repo"
          gh release upload "$tag" dist/checksums.txt --repo "$repo"

  upload-runtime-assets:
    name: Upload independent RPC runtime update assets
    if: ${{ false }}
    needs: build-runtime-update-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download runtime update artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtime-update-artifacts
          path: dist

      - name: Generate runtime checksums
        run: |
          cd dist
          sha256sum * > runtime-checksums.txt

      - name: Upload immutable runtime update assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          repo="${{ github.repository }}"
          existing_assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          for asset in dist/*; do
            name="${asset##*/}"
            if printf '%s\n' "$existing_assets" | grep -Fqx "$name"; then
              echo "release asset already exists and will not be replaced: $name" >&2
              exit 1
            fi
          done
          runtime_payloads=()
          runtime_signatures=()
          runtime_manifests=()
          for asset in dist/*; do
            case "$asset" in
              dist/runtime-checksums.txt) ;;
              *.manifest.json.sig) runtime_signatures+=("$asset") ;;
              *.manifest.json) runtime_manifests+=("$asset") ;;
              *) runtime_payloads+=("$asset") ;;
            esac
          done
          test "${#runtime_payloads[@]}" -eq 4
          test "${#runtime_signatures[@]}" -eq 4
          test "${#runtime_manifests[@]}" -eq 4
          gh release upload "$tag" "${runtime_payloads[@]}" --repo "$repo"
          gh release upload "$tag" "${runtime_signatures[@]}" --repo "$repo"
          gh release upload "$tag" "${runtime_manifests[@]}" --repo "$repo"
          gh release upload "$tag" dist/runtime-checksums.txt --repo "$repo"

  upload-desktop-assets:
    name: Upload Desktop release assets
    if: ${{ false }}
    needs: build-desktop-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Finalize Tauri updater metadata
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          node apps/starweaver-desktop/scripts/finalize-update-metadata.mjs \
            --version "$version" \
            --published-at "${{ github.event.release.published_at }}" \
            --output dist

      - name: Generate Desktop checksums
        run: |
          cd dist
          sha256sum * > desktop-checksums.txt

      - name: Upload immutable Desktop assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          repo="${{ github.repository }}"
          existing_assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          for asset in dist/*; do
            name="${asset##*/}"
            if printf '%s\n' "$existing_assets" | grep -Fqx "$name"; then
              echo "release asset already exists and will not be replaced: $name" >&2
              exit 1
            fi
          done
          payloads=()
          for asset in dist/*; do
            case "$asset" in
              dist/latest.json|dist/desktop-checksums.txt) ;;
              *) payloads+=("$asset") ;;
            esac
          done
          test "${#payloads[@]}" -gt 0
          test -f dist/latest.json
          gh release upload "$tag" "${payloads[@]}" --repo "$repo"
          gh release upload "$tag" dist/latest.json --repo "$repo"
          gh release upload "$tag" dist/desktop-checksums.txt --repo "$repo"

  publish-crates:
    name: Publish crates
    needs: upload-core-assets
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish

  publish-python:
    name: Publish Python package
    needs: upload-core-assets
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist/python
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Publish Python package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/starweaver/ dist/python/*

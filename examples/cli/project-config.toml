# Example project Starweaver CLI config.
# Copy to .starweaver/config.toml.

[general]
default_profile = "workspace"
default_output = "agui-jsonl"
default_hitl = "defer"

[storage]
database_path = "starweaver.sqlite"
file_store_path = "store"

[environment]
provider = "local"
files_policy = "read_write"
shell_enabled = true
workspace_root = ".."

# Opt into macOS observe, pointer, and keyboard Computer Use for every selected CLI profile.
# visible_desktop captures all displays in the current visible desktop layout.
[computer_use]
enabled = true
desktop_scope = "visible_desktop"

[trim]
auto_after_run = true
current_session_keep_recent_runs = 20
all_sessions_keep_days = 60

[server]
default_profile = "default"
database_path = "starweaver.sqlite"
workspace_root = "."
mcp_config_path = "mcp.json"

# Disabled by default. For attended macOS observation, set enabled and
# stdio_observe to true, then explicitly select the macos_observer profile.
[computer_use]
enabled = false
desktop_scope = "primary_display"
grant_ttl_ms = 300000
stdio_observe = false
http_observe = false

[profiles.default]
model_id = "openai-responses:gpt-5"
mcp_servers = ["docs"]

[profiles.macos_observer]
label = "Attended macOS desktop observer"
model_id = "openai-responses:gpt-5"

[providers.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"

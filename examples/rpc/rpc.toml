[server]
default_profile = "default"
database_path = "starweaver.sqlite"
workspace_root = "."
mcp_config_path = "mcp.json"

# CodeAct and file-backed recipes are enabled by default. Set false to disable both.
[codeact]
enabled = true

# Disabled by default. Enable to expose the full macOS Computer Use toolset to
# otherwise authorized runs in every effective profile.
[computer_use]
enabled = false
desktop_scope = "primary_display"
grant_ttl_ms = 300000

[profiles.default]
model_id = "openai-responses:gpt-5"
mcp_servers = ["docs"]

[profiles.macos_observer]
label = "Attended macOS desktop observer"
model_id = "openai-responses:gpt-5"

[providers.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
